name: TNPSC Nova AI CI

on:
  push:
    branches: [main, "staging/p0-supabase-test"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Supabase SDK dependencies
        run: |
          python -m pip check
          python -m pip show supabase supabase-auth supabase-functions postgrest storage3 realtime httpx

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/unit -v
